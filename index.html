<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Christmas Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background-color: #02030d; /* Deep night sky */
        background-image:
          linear-gradient(115deg, rgba(200, 230, 255, 0.38) 0%, rgba(30, 40, 80, 0) 40%, rgba(255, 220, 255, 0.32) 58%, rgba(10, 12, 30, 0) 76%),
          radial-gradient(900px 600px at 45% 45%, rgba(150, 180, 255, 0.22), transparent 65%),
          radial-gradient(1400px 900px at 12% 18%, rgba(90, 120, 200, 0.3), transparent 60%),
          radial-gradient(1200px 800px at 85% 12%, rgba(60, 170, 200, 0.24), transparent 55%),
          radial-gradient(1100px 900px at 60% 85%, rgba(30, 70, 140, 0.28), transparent 60%);
        color: #F0F0F0;
        font-family: 'Lato', sans-serif;
        overflow: hidden;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -10%;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        background:
          repeating-linear-gradient(
            115deg,
            rgba(255, 255, 255, 0.04) 0px,
            rgba(255, 255, 255, 0.06) 20px,
            rgba(255, 255, 255, 0) 60px,
            rgba(255, 255, 255, 0) 120px
          ),
          linear-gradient(115deg, rgba(140, 190, 255, 0.25), rgba(40, 60, 120, 0) 55%, rgba(210, 170, 255, 0.2));
        mix-blend-mode: screen;
        opacity: 0.55;
        filter: blur(2px);
      }
      body::after {
        background:
          radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.9), transparent 50%),
          radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.8), transparent 50%),
          radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,0.7), transparent 50%),
          radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.75), transparent 50%);
        opacity: 0.5;
        filter: blur(0.3px);
      }
      h1, h2, h3 {
        font-family: 'Cinzel', serif;
      }
      /* Hide scrollbar */
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
